<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Clean Architecture layers and allowed dependencies</title>
  <desc id="description">Concentric rings group domain, application, adapters, and composition. A dependency map beside the rings shows that delivery imports usecases, infrastructure imports contracts and domain, and usecases import contracts and domain.</desc>

  <rect width="1280" height="720" rx="20" fill="#f8fafc"/>

  <!-- Rings group code by architectural responsibility, not by identical imports. -->
  <circle cx="345" cy="360" r="300" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="345" cy="360" r="225" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="345" cy="360" r="150" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <circle cx="345" cy="360" r="72" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="345" y="90" font-size="19" font-weight="700">Composition and external systems</text>
    <text x="345" y="114" font-size="14">cmd · internal/app · frameworks and services</text>

    <text x="345" y="163" font-size="19" font-weight="700">Adapters</text>
    <text x="345" y="187" font-size="14">delivery · infrastructure</text>

    <text x="345" y="242" font-size="19" font-weight="700">Application</text>
    <text x="345" y="265" font-size="14">usecases · contracts</text>

    <text x="345" y="351" font-size="20" font-weight="700">Domain</text>
    <text x="345" y="374" font-size="13">entities · value objects</text>
    <text x="345" y="394" font-size="13">business invariants</text>
  </g>

  <!-- The map makes the different dependencies within each ring explicit. -->
  <rect x="680" y="60" width="550" height="600" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#0f172a">
    <text x="710" y="101" font-size="22" font-weight="700">Allowed source dependencies</text>
    <text x="710" y="127" font-size="14" fill="#475569">An arrow means the left package may import the right package.</text>
  </g>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="710" y1="145" x2="1200" y2="145"/>
    <line x1="710" y1="215" x2="1200" y2="215"/>
    <line x1="710" y1="285" x2="1200" y2="285"/>
    <line x1="710" y1="355" x2="1200" y2="355"/>
    <line x1="710" y1="425" x2="1200" y2="425"/>
    <line x1="710" y1="520" x2="1200" y2="520"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#0f172a">
    <text x="710" y="183" font-weight="700">Delivery</text>
    <text x="935" y="183" fill="#475569">→</text>
    <text x="970" y="183">Usecases</text>

    <text x="710" y="253" font-weight="700">Usecases</text>
    <text x="935" y="253" fill="#475569">→</text>
    <text x="970" y="248">Repository contracts</text>
    <text x="970" y="270">and domain</text>

    <text x="710" y="323" font-weight="700">Repository contracts</text>
    <text x="935" y="323" fill="#475569">→</text>
    <text x="970" y="323">Domain</text>

    <text x="710" y="393" font-weight="700">Infrastructure</text>
    <text x="935" y="393" fill="#475569">→</text>
    <text x="970" y="388">Repository contracts</text>
    <text x="970" y="410">and domain</text>

    <text x="710" y="460" font-weight="700">Delivery · Usecases</text>
    <text x="710" y="482" font-weight="700">· Infrastructure</text>
    <text x="935" y="471" fill="#475569">→</text>
    <text x="970" y="466">Shared technical</text>
    <text x="970" y="488">contracts</text>

    <text x="710" y="566" font-weight="700">App</text>
    <text x="935" y="566" fill="#475569">→</text>
    <text x="970" y="561">All layers</text>
    <text x="970" y="583" font-size="14" fill="#475569">composition only</text>
  </g>

  <text x="710" y="624" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#475569">Shared technical contracts include logging, observability, and security.</text>
</svg>
