    schema: "internal/infra/db/postgres/sqlc/schema/auth.sql"
    queries:
      - "internal/infra/db/postgres/sqlc/health.sql"
      - "internal/infra/db/postgres/sqlc/user.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/infra/db/postgres/sqlc/gen"
        sql_package: "pgx/v5"
