name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer commit makes an older run for the same branch or pull request obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs without a `needs` dependency run in parallel. Each job receives a fresh
# runner, so every job must check out the repository and set up Go independently.
jobs:
  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history makes the exact pull-request or push baseline available to OASDiff.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Lint contract and verify generated files
        run: make openapi-lint openapi-generated-check

      - name: Check pull request for breaking contract changes
        if: github.event_name == 'pull_request'
        run: >-
          make openapi-breaking
          OPENAPI_BREAKING_BASE_REF='${{ github.event.pull_request.base.sha }}'

      - name: Check direct push for breaking contract changes
        if: github.event_name == 'push'
        run: >-
          make openapi-breaking
          OPENAPI_BREAKING_BASE_REF='${{ github.event.before }}'

  protobuf:
    name: Protobuf contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history makes the exact pull-request or push baseline available to Buf.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Lint contracts and verify generated files
        run: make proto-lint proto-generated-check

      - name: Check pull request for breaking contract changes
        if: github.event_name == 'pull_request'
        run: >-
          make proto-breaking
          PROTO_BREAKING_BASE_REF='${{ github.event.pull_request.base.sha }}'
          PROTO_BREAKING_AGAINST='.git#commit=${{ github.event.pull_request.base.sha }},subdir=contracts/grpc'

      - name: Check direct push for breaking contract changes
        if: github.event_name == 'push'
        run: >-
          make proto-breaking
          PROTO_BREAKING_BASE_REF='${{ github.event.before }}'
          PROTO_BREAKING_AGAINST='.git#commit=${{ github.event.before }},subdir=contracts/grpc'

  unit:
    name: Unit and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check formatting, vet, and build
        run: make check

      - name: Run unit tests with race detector
        run: make test-race

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      # GitHub-hosted Ubuntu runners provide Docker. Testcontainers owns the
      # PostgreSQL and Redis lifecycle, so CI needs no duplicated service setup.
      - name: Run integration tests
        run: make test-integration
